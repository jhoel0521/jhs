# Publica una release al subir un tag `vX.Y.Z`:
#   git tag v0.2.0 && git push origin v0.2.0
# Genera los paquetes que descarga `jhs update` (ver src/domain/version.rs):
#   jhs-<ver>-linux-x86_64.tar.gz · jhs-<ver>-windows-x86_64.zip · SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            ext: tar.gz
          - name: windows-x86_64
            os: windows-latest
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Comprobar que el tag coincide con Cargo.toml y la skill
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$ver\"" Cargo.toml || { echo "Cargo.toml no es $ver"; exit 1; }
          grep -q "version: \"$ver\"" skills/jhs/SKILL.md || { echo "SKILL.md no es $ver"; exit 1; }
      - run: cargo test --release
      - run: cargo build --release
      - name: Empaquetar
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          pkg="jhs-$ver-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp README.md LICENSE NOTICE "dist/$pkg/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/jhs.exe target/release/jhsw.exe "dist/$pkg/"
            (cd dist && 7z a "$pkg.zip" "$pkg" > /dev/null)
          else
            cp target/release/jhs target/release/jhsw "dist/$pkg/"
            tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.${{ matrix.ext }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "jhs $GITHUB_REF_NAME" --generate-notes
